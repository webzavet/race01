get:
  tags:
    - Cards
  summary: Get all cards
  description: Retrieve all cards
  responses:
    '200':
      description: Cards retrieved successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../spec/components/schemas/Card.yaml'
    '400':
      description: Invalid request parameters
      content:
        application/json:
          schema:
           $ref: '../spec/components/schemas/Errors.yaml'
    '404':
      description: Cards not found
      content:
        application/json:
          schema:
            $ref: '../spec/components/schemas/Errors.yaml'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../spec/components/schemas/Errors.yaml'
