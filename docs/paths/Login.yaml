post:
  tags:
    - Auth
  summary: Login user
  description: Login user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../spec/components/schemas/Login.yaml'
  responses:
    '200':
      description: Login successful
      content:
        application/json:
          schema:
            $ref: '../spec/components/schemas/Token.yaml'
    '409':
      description: Conflict
      content:
        application/vnd.api+json:
          schema:
            $ref: '../spec/components/schemas/Errors.yaml'
    '404':
      description: User with this username does not exist
      content:
        application/json:
          schema:
            $ref: '../spec/components/schemas/Errors.yaml'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../spec/components/schemas/Errors.yaml'