post:
  tags:
    - Room
  summary: Join room
  description: Join room by ID
  responses:
    '200':
      description: Room joined successfully
      content:
        application/json:
          schema:
            $ref: '../spec/components/schemas/Room.yaml'
    '400':
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '../spec/components/schemas/Errors.yaml'
    '404':
      description: Room not found
      content:
        application/json:
          schema:
            $ref: '../spec/components/schemas/Errors.yaml'
    '409':
      description: Conflict with existing room
      content:
        application/json:
          schema:
            $ref: '../spec/components/schemas/Errors.yaml'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../spec/components/schemas/Errors.yaml'

delete:
  tags:
      - Room
  summary: Leave room
  description: Leave room by ID
  responses:
    '204':
      description: Room left successfully
    '400':
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '../spec/components/schemas/Errors.yaml'
    '404':
      description: Room not found
      content:
        application/json:
          schema:
            $ref: '../spec/components/schemas/Errors.yaml'
    '409':
      description: Conflict with existing room
      content:
        application/json:
          schema:
            $ref: '../spec/components/schemas/Errors.yaml'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../spec/components/schemas/Errors.yaml'
