# schemas/Errors.yaml
description: Standard JSON:API Error Object
type: object
required:
  - errors
properties:
  errors:
    type: array
    description: Non-empty array of errors occurred during request processing
    items:
      type: object
      required:
        - code
        - status
        - detail
      properties:
        code:
          type: string
          description: Application-specific error code
          example: 'CODE_OF_ERROR'
        status:
          type: string
          description: HTTP status code
          example: 'XXX'
        detail:
          type: string
          description: Human-readable error message
          example: 'Description of the error'
