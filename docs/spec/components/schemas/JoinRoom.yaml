type: object
required:
  - data
properties:
  data:
    type: object
    required:
      - id
      - type
      - attributes
    properties:
      id:
        type: string
        example: GroveStreet
        description: Name of the room.
      type:
        type: string
        enum: [join_room]
        description: The type of the resource.
      attributes:
        type: object
        required:
          - password
        properties:
          password:
            type: string
            example: password123
            description: The password of the room.
