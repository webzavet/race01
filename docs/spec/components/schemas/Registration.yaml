type: object
required:
  - data
properties:
  data:
    type: object
    required:
      - id
      - type
      - attributes
    properties:
      id:
        type: string
        example: johndoe
        description: The username of the user.
      type:
        type: string
        enum: [registration]
        description: The type of the resource.
      attributes:
        type: object
        required:
          - password
          - password_confirmation
        properties:
          password:
            type: string
            example: password123
            description: The password of the user.
          password_confirmation:
            type: string
            example: password123
            description: The password confirmation of the user.
