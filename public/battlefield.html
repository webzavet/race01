<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Battlefield</title>
  <link rel="stylesheet" href="css/battlefield.css">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="container">
        <div class="player_cards">
            
        </div>
        <div class ="battlefield">
            <div class="enemy">
                <div class ="enemy_battle">
                    <div class="enemy_cards">
                        <img src="media/menu/card_back.jpg" class="enemy_card_img" alt="card 5">
                        <img src="media/menu/card_back.jpg" class="enemy_card_img" alt="card 5">
                        <img src="media/menu/card_back.jpg" class="enemy_card_img" alt="card 5">
                        <img src="media/menu/card_back.jpg" class="enemy_card_img" alt="card 5">
                        <img src="media/menu/card_back.jpg" class="enemy_card_img" alt="card 5">
                    </div>
                    <div class="enemy_play_cards">
                    </div>
                </div>
                <div class ="avatar_container_enemy">
                    <img src="media/menu/aloha.jpg" class="enemy_avatar" alt="card 5">
                    <div id="enemy_hp">30</div>
                    <div id="enemy_nickname">bignt</div>
                </div>
            </div>
            <div class ="board">
                <div class="timer">
                    30
                </div>
                <div class="move">
                    <img src="media/menu/finger_png.png" class="move_check">
                </div>
                <div class="board_button_container">
                    <button class ="board_button" id="rotateBtn" type="button">end move</button>
                    <button class ="board_button" id="big_nt_btn" type="button">Give up</button>
                </div>
                
            </div>
                
                <div class="player">
                    <div class ="player_battle" id="player_battle">
                    
                    </div>
                    <div class ="avatar_container_player">
                        <div class="name" id="nickname">bignt</div>
                        <div class="hp_mana">
                        <div id="player_hp">30</div>
                        <div id="player_mana">30</div>
                        </div>
                    <img src="media/menu/petya.webp" class="player_avatar" alt="card 5">
                    
                    
                </div>
            </div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/init.js"></script>

</body>
</html>
