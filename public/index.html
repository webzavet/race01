<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Menu</title>
        <link rel="stylesheet" href="css/style.css" />
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    </head>
    <body>
        <div class="title-container">
            <img class="title-logo" src="./media/menu/swagarusblack.png" alt="logo" />
        </div>
        <div class="background-overlay"></div>
        <div class="menu-box">
            <h2 class="username">Welcome</h2>
            <!-- change to login -->

            <p class="avatar-title">Choose your avatar:</p>
            <div class="avatar-selection">
                <img src="media/menu/pespatron.webp" class="avatar" alt="Patron" />
                <img src="media/menu/petya.webp" class="avatar" alt="Petya" />
                <img src="media/menu/og.jpg" class="avatar" alt="Og style" />
                <img src="media/menu/aloha.jpg" class="avatar" alt="aloha" />
            </div>

            <div class="buttons">
                <button class="btn logout">Logout</button>
                <button
                    class="btn collection"
                    type="button"
                    onclick="window.location.href='wiki.html'"
                >
                    wiki
                </button>
                <button class="btn play" type="button">Play</button>
            </div>
        </div>

        <div class="game_starting">
            <div class="board_around">
                <div class="radio_container">
                    <input
                        type="radio"
                        id="create"
                        name="session"
                        value="create"
                        class="input_display"
                    />
                    <label for="create" id="left">Create session</label>

                    <input
                        type="radio"
                        id="connect"
                        name="session"
                        value="connect"
                        class="input_display"
                    />
                    <label for="connect" id="right">Connect session</label>
                </div>
                <form class="data_container">
                    <input
                        type="text"
                        placeholder="Name of lobby"
                        id="name_for_lobby"
                        name="name_for_lobby"
                        required
                    />
                    <input
                        type="password"
                        placeholder="Password"
                        id="password_for_lobby"
                        name="password_for_lobby"
                        required
                    />
                </form>
                <div id="message"></div>
                <div class="button_container">
                    <button class="btn_cofirm" id="btn_back">Back</button>
                    <button class="btn_cofirm" id="btn_confirm">Confirm</button>
                </div>
            </div>
        </div>

        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/logout.js"></script>
        <script src="js/hide.js"></script>
        <script src="js/session.js"></script>
    </body>
</html>
